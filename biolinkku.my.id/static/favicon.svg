<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="linkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#bgGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Chain links representing bio links -->
  <g transform="translate(50,50)">
    <!-- First link -->
    <ellipse cx="-8" cy="-10" rx="6" ry="10" fill="none" stroke="url(#linkGradient)" stroke-width="3" transform="rotate(-30)"/>
    
    <!-- Second link -->
    <ellipse cx="8" cy="-10" rx="6" ry="10" fill="none" stroke="url(#linkGradient)" stroke-width="3" transform="rotate(30)"/>
    
    <!-- Third link -->
    <ellipse cx="0" cy="10" rx="6" ry="10" fill="none" stroke="url(#linkGradient)" stroke-width="3"/>
    
    <!-- Center connecting element -->
    <circle cx="0" cy="0" r="4" fill="#ffffff" stroke="url(#linkGradient)" stroke-width="2"/>
  </g>
  
  <!-- Bio text indicator -->
  <text x="50" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">BIO</text>
</svg>